<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作進度追蹤工具</title>
<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --bg:#f3f6fb; --card:#fff;
  --text:#172033; --muted:#64748b; --border:#e2e8f0; --danger:#dc2626;
  --warning:#d97706; --success:#16a34a; --shadow:0 8px 28px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.header{background:linear-gradient(135deg,#1d4ed8,#2563eb 55%,#38bdf8);color:#fff;padding:28px 20px}
.header-inner{max-width:1400px;margin:auto}
.header h1{margin:0 0 7px;font-size:30px}
.header p{margin:0;opacity:.9}
.container{max-width:1400px;margin:24px auto;padding:0 18px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.stat .label{color:var(--muted);font-size:14px}.stat .num{font-size:28px;font-weight:800;margin-top:5px}
.toolbar,.form-card,.table-card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.toolbar{padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input{flex:1;min-width:220px}
.form-card{padding:20px;margin-bottom:18px}
.form-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.form-title h2{margin:0;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#475569}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{resize:vertical;min-height:80px}
.full{grid-column:1/-1}
.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:14px}
.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-light{background:#eef2f7;color:#334155}.btn-danger{background:#fee2e2;color:#b91c1c}
.btn-success{background:#dcfce7;color:#15803d}
.table-card{overflow:hidden}
.table-head{padding:17px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.table-head h2{font-size:19px;margin:0}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}
th,td{padding:13px 14px;border-bottom:1px solid #edf2f7;text-align:left;vertical-align:middle}
th{background:#f8fafc;color:#475569;font-size:13px;white-space:nowrap}
tr:hover td{background:#fafcff}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.badge-not{background:#f1f5f9;color:#475569}.badge-doing{background:#dbeafe;color:#1d4ed8}
.badge-wait{background:#fef3c7;color:#b45309}.badge-done{background:#dcfce7;color:#15803d}
.badge-overdue{background:#fee2e2;color:#b91c1c}
.overdue{color:var(--danger);font-weight:800}.near{color:var(--warning);font-weight:800}
.row-actions{display:flex;gap:6px}
.icon-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 9px}
.empty{text-align:center;padding:45px;color:var(--muted)}
.notice{margin:0 0 15px;padding:11px 13px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}
@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.full{grid-column:auto}.header h1{font-size:24px}.container{padding:0 10px}.stat{padding:14px}.stat .num{font-size:23px}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <h1>📋 工作進度追蹤工具</h1>
    <p>集中管理請購、試模、修模及其他工作案件，快速掌握目前進度與預計完成時間。</p>
  </div>
</header>

<main class="container">
  <section class="stats">
    <div class="stat"><div class="label">全部案件</div><div class="num" id="statAll">0</div></div>
    <div class="stat"><div class="label">未開始</div><div class="num" id="statNot">0</div></div>
    <div class="stat"><div class="label">進行中</div><div class="num" id="statDoing">0</div></div>
    <div class="stat"><div class="label">待確認</div><div class="num" id="statWait">0</div></div>
    <div class="stat"><div class="label">逾期案件</div><div class="num" id="statOverdue">0</div></div>
  </section>

  <section class="toolbar">
    <input id="search" type="search" placeholder="🔎 搜尋案件名稱、負責人、備註...">
    <select id="filterStatus">
      <option value="all">全部進度</option>
      <option value="未開始">未開始</option>
      <option value="進行中">進行中</option>
      <option value="待確認">待確認</option>
      <option value="已完成">已完成</option>
    </select>
    <select id="filterType">
      <option value="all">全部類別</option>
      <option value="請購">請購</option>
      <option value="試模">試模</option>
      <option value="修模">修模</option>
      <option value="其他">其他</option>
    </select>
    <button class="btn btn-light" id="exportBtn">⬇ 匯出 CSV</button>
    <button class="btn btn-danger" id="clearBtn">清除全部</button>
  </section>

  <section class="form-card">
    <div class="form-title">
      <h2 id="formTitle">➕ 新增工作案件</h2>
      <button class="btn btn-light" id="cancelEdit" style="display:none">取消編輯</button>
    </div>
    <div class="notice">資料會自動儲存在目前瀏覽器的 LocalStorage，不需要資料庫也能使用。若要多人共用，之後可再升級成雲端版本。</div>
    <form id="workForm">
      <div class="grid">
        <div class="field">
          <label>案件名稱 *</label>
          <input id="name" required placeholder="例如：A產品試模">
        </div>
        <div class="field">
          <label>類別</label>
          <select id="type">
            <option>請購</option><option>試模</option><option>修模</option><option>其他</option>
          </select>
        </div>
        <div class="field">
          <label>申請日期</label>
          <input id="applyDate" type="date">
        </div>
        <div class="field">
          <label>預計完成日</label>
          <input id="dueDate" type="date">
        </div>
        <div class="field">
          <label>目前進度</label>
          <select id="status">
            <option>未開始</option><option>進行中</option><option>待確認</option><option>已完成</option>
          </select>
        </div>
        <div class="field">
          <label>負責人</label>
          <input id="owner" placeholder="例如：王小明">
        </div>
        <div class="field full">
          <label>備註</label>
          <textarea id="note" placeholder="補充目前進度、問題、聯絡事項..."></textarea>
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary" id="submitBtn">新增案件</button>
      </div>
    </form>
  </section>

  <section class="table-card">
    <div class="table-head">
      <h2>📊 案件清單</h2>
      <span id="resultCount" style="color:#64748b;font-size:13px"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>案件名稱</th><th>類別</th><th>申請日期</th><th>預計完成</th>
            <th>進度</th><th>負責人</th><th>狀態提醒</th><th>備註</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty">目前沒有案件，請從上方新增第一筆工作。</div>
    </div>
  </section>
</main>
<div class="footer">工作進度追蹤工具｜資料儲存在本機瀏覽器</div>

<script>
const STORAGE_KEY = "work_progress_tracker_v1";
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let editingId = null;

const $ = id => document.getElementById(id);
const todayISO = () => {
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
};
$("applyDate").value = todayISO();

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function statusBadge(s){
  const cls = s==="已完成" ? "badge-done" : s==="進行中" ? "badge-doing" : s==="待確認" ? "badge-wait" : "badge-not";
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}
function dateText(d){ return d ? d.replaceAll("-","/") : "—"; }

function dueInfo(r){
  if(!r.dueDate || r.status==="已完成") return `<span style="color:#94a3b8">—</span>`;
  const today = new Date(todayISO()+"T00:00:00");
  const due = new Date(r.dueDate+"T00:00:00");
  const diff = Math.ceil((due-today)/86400000);
  if(diff < 0) return `<span class="badge badge-overdue">⚠ 逾期 ${Math.abs(diff)} 天</span>`;
  if(diff === 0) return `<span class="near">⚠ 今天到期</span>`;
  if(diff <= 3) return `<span class="near">即將到期（${diff} 天）</span>`;
  return `<span style="color:#64748b">剩 ${diff} 天</span>`;
}

function filtered(){
  const q = $("search").value.trim().toLowerCase();
  const fs = $("filterStatus").value, ft = $("filterType").value;
  return records.filter(r => {
    const text = [r.name,r.owner,r.note,r.type,r.status].join(" ").toLowerCase();
    return (!q || text.includes(q)) && (fs==="all" || r.status===fs) && (ft==="all" || r.type===ft);
  }).sort((a,b) => {
    if(a.status==="已完成" && b.status!=="已完成") return 1;
    if(a.status!=="已完成" && b.status==="已完成") return -1;
    return (a.dueDate||"9999-99-99").localeCompare(b.dueDate||"9999-99-99");
  });
}

function render(){
  const list = filtered();
  $("tbody").innerHTML = list.map(r => `
    <tr>
      <td><strong>${esc(r.name)}</strong></td>
      <td>${esc(r.type)}</td>
      <td>${dateText(r.applyDate)}</td>
      <td>${dateText(r.dueDate)}</td>
      <td>${statusBadge(r.status)}</td>
      <td>${esc(r.owner)||"—"}</td>
      <td>${dueInfo(r)}</td>
      <td style="max-width:220px">${esc(r.note)||"—"}</td>
      <td>
        <div class="row-actions">
          <button class="icon-btn" title="編輯" onclick="editRecord('${r.id}')">✏️</button>
          <button class="icon-btn" title="刪除" onclick="deleteRecord('${r.id}')">🗑️</button>
        </div>
      </td>
    </tr>
  `).join("");
  $("empty").style.display = list.length ? "none" : "block";
  $("resultCount").textContent = `顯示 ${list.length} / ${records.length} 筆`;
  updateStats();
}

function updateStats(){
  const count = s => records.filter(r=>r.status===s).length;
  const overdue = records.filter(r=>r.status!=="已完成" && r.dueDate && r.dueDate < todayISO()).length;
  $("statAll").textContent=records.length;
  $("statNot").textContent=count("未開始");
  $("statDoing").textContent=count("進行中");
  $("statWait").textContent=count("待確認");
  $("statOverdue").textContent=overdue;
}

$("workForm").addEventListener("submit", e=>{
  e.preventDefault();
  const data = {
    name:$("name").value.trim(), type:$("type").value, applyDate:$("applyDate").value,
    dueDate:$("dueDate").value, status:$("status").value, owner:$("owner").value.trim(),
    note:$("note").value.trim()
  };
  if(!data.name) return;
  if(editingId){
    const i=records.findIndex(r=>r.id===editingId);
    if(i>=0) records[i]={...records[i],...data};
  }else{
    records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2), createdAt:new Date().toISOString(),...data});
  }
  save(); resetForm(); render();
});

function resetForm(){
  editingId=null;
  $("workForm").reset();
  $("applyDate").value=todayISO();
  $("formTitle").textContent="➕ 新增工作案件";
  $("submitBtn").textContent="新增案件";
  $("cancelEdit").style.display="none";
}
window.editRecord = id => {
  const r=records.find(x=>x.id===id); if(!r)return;
  editingId=id;
  $("name").value=r.name; $("type").value=r.type; $("applyDate").value=r.applyDate||"";
  $("dueDate").value=r.dueDate||""; $("status").value=r.status; $("owner").value=r.owner||""; $("note").value=r.note||"";
  $("formTitle").textContent="✏️ 編輯工作案件";
  $("submitBtn").textContent="儲存修改";
  $("cancelEdit").style.display="inline-block";
  window.scrollTo({top:document.querySelector(".form-card").offsetTop-10,behavior:"smooth"});
};
window.deleteRecord = id => {
  const r=records.find(x=>x.id===id);
  if(!r || !confirm(`確定要刪除「${r.name}」嗎？`)) return;
  records=records.filter(x=>x.id!==id); save(); render();
};

$("cancelEdit").onclick=resetForm;
["search","filterStatus","filterType"].forEach(id=>$(id).addEventListener("input",render));

$("clearBtn").onclick=()=>{
  if(!records.length) return alert("目前沒有資料。");
  if(confirm("確定要清除全部案件嗎？此操作無法復原。")){
    records=[]; save(); resetForm(); render();
  }
};

$("exportBtn").onclick=()=>{
  if(!records.length) return alert("目前沒有資料可匯出。");
  const headers=["案件名稱","類別","申請日期","預計完成日","進度","負責人","備註"];
  const rows=records.map(r=>[r.name,r.type,r.applyDate,r.dueDate,r.status,r.owner,r.note]);
  const csv="\uFEFF"+[headers,...rows].map(row=>row.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`工作進度_${todayISO()}.csv`; a.click(); URL.revokeObjectURL(a.href);
};

render();
</script>
</body>
</html>
